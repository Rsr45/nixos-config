[audio]
enable_sounds = true

[bar]
order = [ "default" ]

    [bar.default]
    border_width = 2.0
    capsule_radius = 0
    center = []
    end = [
        "media",
        "spacer_5",
        "cpu",
        "temp",
        "ram",
        "sysmon",
        "clipboard",
        "spacer_3",
        "network",
        "network_rx",
        "network_tx",
        "spacer_2",
        "notifications",
        "lock_keys",
        "keyboard_layout",
        "spacer_8",
        "volume",
        "input_volume",
        "spacer_4",
        "session"
    ]
    margin_ends = 10
    position = "bottom"
    radius = 0
    start = [ "control-center", "clock", "spacer_6", "workspaces", "spacer_7", "active_window", "tray" ]

[control_center]
sidebar = "full"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "wallpaper"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 144.0
    box_width = 416.0
    cx = 1632.0
    cy = 925.0
    output = "DP-3"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        color = "on_surface"
        shadow = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 144.0
    box_width = 224.0
    cx = 176.0
    cy = 948.0
    output = "DP-3"
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        stat2 = "cpu_temp"

[dock]
auto_hide = true
reserve_space = false

[location]
address = "Menemen, izmir"

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[notification]
layer = "overlay"
position = "bottom_right"

[osd]
position = "bottom_center"

[shell]
app_icon_color = "secondary"
clipboard_enabled = false
corner_radius_scale = 0.0
password_style = "random"
screen_time_enabled = true
settings_show_advanced = true

    [shell.panel]
    control_center_placement = "centered"
    open_near_click_control_center = true
    session_placement = "centered"
    transparency_mode = "glass"
    wallpaper_placement = "centered"

    [shell.screenshot]
    directory = "/home/hare/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [shell.shadow]
    direction = "down_right"

[theme]
builtin = "Gruvbox"

[wallpaper]
directory = "/home/hare/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/hare/Pictures/Wallpapers/818590.jpg"

    [wallpaper.last]
    path = "/home/hare/Pictures/Wallpapers/818590.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/hare/Pictures/Wallpapers/818590.jpg"

[weather]
refresh_minutes = 60

[widget.active_window]
title_scroll = "on_hover"

[widget.cpu]
display = "text"

[widget.keyboard_layout]
show_icon = false

[widget.lock_keys]
hide_when_off = true

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network_rx]
display = "text"

[widget.network_tx]
display = "text"

[widget.notifications]
hide_when_no_unread = true

[widget.ram]
display = "text"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.spacer_5]
type = "spacer"

[widget.spacer_6]
type = "spacer"

[widget.spacer_7]
type = "spacer"

[widget.spacer_8]
type = "spacer"

[widget.sysmon]
stat = "disk_pct"

[widget.temp]
display = "text"

[widget.workspaces]
display = "none"
